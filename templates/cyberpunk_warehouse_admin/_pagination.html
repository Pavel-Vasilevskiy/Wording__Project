{% if pagination.pages > 1 %}<nav class="cw-pagination" aria-label="Pagination">{% if pagination.has_prev %}<a class="ds-button ds-button--secondary ds-button--small" href="{{ cw_page_url(pagination.prev_num) }}">Previous</a>{% endif %}<span>Page {{ pagination.page }} of {{ pagination.pages }}</span>{% if pagination.has_next %}<a class="ds-button ds-button--secondary ds-button--small" href="{{ cw_page_url(pagination.next_num) }}">Next</a>{% endif %}</nav>{% endif %}
