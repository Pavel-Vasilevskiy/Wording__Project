{% extends "cyberpunk_warehouse_admin/base.html" %}
{% block title %}{{ form_title }} · Cyberpunk Warehouse{% endblock %}
{% block content %}<section class="cw-admin-panel cw-form-panel"><div class="cw-panel-heading"><div><h2>{{ form_title }}</h2><p class="cw-muted">Set a stable key and display order for products.</p></div><a href="{{ url_for('cyberpunk_warehouse_admin.categories') }}">Back to categories</a></div>
<form method="post" class="cw-form"><input type="hidden" name="csrf_token" value="{{ cw_csrf_token() }}"><div class="cw-form-grid">
<label>Name<input name="name" required maxlength="100" value="{{ request.form.get('name', category.name) }}"></label><label>Internal key<input name="internal_key" required maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" value="{{ request.form.get('internal_key', category.internal_key) }}"></label>
<label>Display order<input type="number" name="sort_order" min="0" value="{{ request.form.get('sort_order', category.sort_order or 0) }}"></label><label>Icon<select name="icon_asset_id"><option value="">No icon</option>{% for asset in assets %}<option value="{{ asset.id }}" {% if request.form.get('icon_asset_id', category.icon_asset_id|string if category.icon_asset_id else '') == asset.id|string %}selected{% endif %}>{{ asset.alt_text or asset.asset_key }}</option>{% endfor %}</select><small>Upload category icons as “UI / category icon” assets.</small></label>
<label class="cw-span-2">Description<textarea name="description" maxlength="600" rows="3">{{ request.form.get('description', category.description or '') }}</textarea></label><label class="cw-checkbox"><input type="checkbox" name="is_active" value="1" {% if request.form.get('is_active', '1' if category.is_active else '') == '1' %}checked{% endif %}> Active</label></div>
<div class="cw-actions"><button class="ds-button ds-button--primary" type="submit">Save category</button><a class="ds-button ds-button--secondary" href="{{ url_for('cyberpunk_warehouse_admin.categories') }}">Cancel</a></div></form></section>{% endblock %}
