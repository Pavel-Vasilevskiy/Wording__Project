# fly.toml app configuration file generated for wordle-game on 2024-01-01T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "wordle-game"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Fly Machine count is app state, not a fly.toml setting. Use `fly scale count 1`
# and deploy with `--ha=false` so this SQLite volume has a single writer.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[env]
  FLASK_ENV = "production"
  PORT = "8080"
  DATABASE_URL = "sqlite:////data/wordle_users.db"

[mounts]
  source = "wordle_data"
  destination = "/data"
